<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cart · Streetwear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div data-site-header></div>

    <main class="container">
      <section class="cart" id="cart">
        <h1 class="page-title">Your cart</h1>
        <div class="cart-main">
          <div class="cart-items" id="items"><p class="message">Loading…</p></div>

          <form id="checkout-form" class="checkout-form" hidden novalidate>
            <h2>Shipping details</h2>
            <div class="field full">
              <label for="name">Full name</label>
              <input id="name" name="name" autocomplete="name" required maxlength="100" />
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" required maxlength="254" />
            </div>
            <div class="field">
              <label for="phone">Phone</label>
              <input id="phone" name="phone" type="tel" autocomplete="tel" required maxlength="30" />
            </div>
            <div class="field full">
              <label for="address1">Street address</label>
              <input id="address1" name="address1" autocomplete="address-line1" required maxlength="200" />
            </div>
            <div class="field full">
              <label for="address2">Apartment, suite, etc. <span class="optional">(optional)</span></label>
              <input id="address2" name="address2" autocomplete="address-line2" maxlength="200" />
            </div>
            <div class="field">
              <label for="city">City</label>
              <input id="city" name="city" autocomplete="address-level2" required maxlength="100" />
            </div>
            <div class="field">
              <label for="postalCode">Postal code</label>
              <input id="postalCode" name="postalCode" autocomplete="postal-code" required maxlength="20" />
            </div>
            <div class="field full">
              <label for="country">Country</label>
              <input id="country" name="country" autocomplete="country-name" required maxlength="100" />
            </div>
          </form>
        </div>

        <aside class="summary" id="summary" hidden></aside>
      </section>
    </main>

    <div data-site-footer></div>

    <script type="module">
      import { api, formatPrice, getCart, saveCart, escapeHtml, thumb, parseSizes } from "/app.js";

      const root = document.getElementById("cart");
      const itemsEl = document.getElementById("items");
      const summaryEl = document.getElementById("summary");
      const form = document.getElementById("checkout-form");
      const SHIPPING_FLAT = 500;
      const FREE_SHIPPING_OVER = 5000;
      let catalog = {};

      function render() {
        // Drop anything that's no longer in the catalog, or whose size no longer exists.
        const cart = getCart().filter((l) => {
          const p = catalog[l.id];
          if (!p) return false;
          const sizes = parseSizes(p.sizes);
          return sizes.length ? sizes.includes(l.size) : !l.size;
        });
        saveCart(cart);

        if (cart.length === 0) {
          itemsEl.innerHTML = `<div class="empty"><p>Your cart is empty.</p><a class="btn btn-lg" href="/#shop">Shop the drop</a></div>`;
          form.hidden = true;
          summaryEl.hidden = true;
          return;
        }

        const subtotal = cart.reduce((s, l) => s + catalog[l.id].price * l.qty, 0);
        const shipping = subtotal >= FREE_SHIPPING_OVER ? 0 : SHIPPING_FLAT;

        // Stock is shared across sizes, so compare against the product's total in the cart.
        const qtyByProduct = {};
        for (const l of cart) qtyByProduct[l.id] = (qtyByProduct[l.id] || 0) + l.qty;

        itemsEl.innerHTML = cart
          .map((l) => {
            const p = catalog[l.id];
            const key = escapeHtml(`${l.id}|${l.size}`);
            const low = qtyByProduct[l.id] > p.stock;
            return `
            <div class="cart-item">
              ${thumb(p)}
              <div>
                <a href="/product?id=${encodeURIComponent(p.id)}"><strong>${escapeHtml(p.name)}</strong></a>
                <div class="hint">${l.size ? `Size ${escapeHtml(l.size)} · ` : ""}${formatPrice(p.price)} each</div>
                ${low ? `<div class="hint" style="color:var(--danger)">${p.stock === 0 ? "Sold out" : `Only ${p.stock} left`}</div>` : ""}
              </div>
              <div style="display:flex;gap:4px;align-items:center">
                <input class="qty" type="number" min="1" max="10" value="${l.qty}" data-qty="${key}" aria-label="Quantity for ${escapeHtml(p.name)}" />
                <button type="button" class="btn btn-ghost" data-remove="${key}" aria-label="Remove ${escapeHtml(p.name)}">✕</button>
              </div>
              <strong class="line-total">${formatPrice(p.price * l.qty)}</strong>
            </div>`;
          })
          .join("");

        form.hidden = false;
        summaryEl.hidden = false;
        summaryEl.innerHTML = `
          <h2>Order summary</h2>
          <div class="row"><span>Subtotal</span><span>${formatPrice(subtotal)}</span></div>
          <div class="row"><span>Shipping</span><span>${shipping === 0 ? "Free" : formatPrice(shipping)}</span></div>
          <div class="row total"><span>Total</span><span>${formatPrice(subtotal + shipping)}</span></div>
          <button type="submit" form="checkout-form" class="btn btn-lg" id="place">Place order</button>
          <p class="form-error" id="error" role="alert"></p>
          <p class="hint">${shipping === 0 ? "You've unlocked free shipping." : `Add ${formatPrice(FREE_SHIPPING_OVER - subtotal)} more for free shipping.`}</p>
          <p class="hint">No payment is taken online.</p>`;
      }

      root.addEventListener("change", (e) => {
        const key = e.target.dataset.qty;
        if (!key) return;
        const qty = Math.max(1, Math.min(10, parseInt(e.target.value, 10) || 1));
        saveCart(getCart().map((l) => (`${l.id}|${l.size}` === key ? { ...l, qty } : l)));
        render();
      });

      root.addEventListener("click", (e) => {
        const removeKey = e.target.dataset.remove;
        if (!removeKey) return;
        saveCart(getCart().filter((l) => `${l.id}|${l.size}` !== removeKey));
        render();
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById("error");
        const button = document.getElementById("place");
        errorEl.textContent = "";

        // Highlight the first empty or invalid field before calling the server.
        const invalid = [...form.elements].find((el) => el.willValidate && !el.checkValidity());
        if (invalid) {
          invalid.focus();
          errorEl.textContent = `Please check: ${form.querySelector(`label[for="${invalid.id}"]`).firstChild.textContent.trim()}`;
          return;
        }

        button.disabled = true;
        button.textContent = "Placing order…";
        try {
          const customer = Object.fromEntries(new FormData(form));
          const order = await api("/api/checkout", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ items: getCart(), customer }),
          });
          saveCart([]);
          root.innerHTML = `
            <div class="order-done">
              <h2>Order placed!</h2>
              <p>Order number <strong>${escapeHtml(order.orderId)}</strong></p>
              <p>Total ${formatPrice(order.total)}</p>
              <p class="hint">We'll contact you at ${escapeHtml(order.email)} when it ships.</p>
              <a class="btn btn-lg" href="/">Keep shopping</a>
            </div>`;
        } catch (err) {
          errorEl.textContent = err.message;
          button.disabled = false;
          button.textContent = "Place order";
          // Stock may have changed; refresh it so the cart shows what's left.
          try {
            const { products } = await api("/api/products");
            catalog = Object.fromEntries(products.map((p) => [p.id, p]));
            const msg = errorEl.textContent;
            render();
            document.getElementById("error").textContent = msg;
          } catch {}
        }
      });

      try {
        const { products } = await api("/api/products");
        catalog = Object.fromEntries(products.map((p) => [p.id, p]));
        render();
      } catch (err) {
        itemsEl.innerHTML = `<p class="message error">Couldn't load your cart. ${escapeHtml(err.message)}</p>`;
      }
    </script>
  </body>
</html>
